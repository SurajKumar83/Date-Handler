<div class="auth-shell">
  <div class="panel login-panel">
    <div class="blob blob-top"></div>
    <div class="blob blob-mid"></div>
    <div class="blob blob-dot"></div>

    <div class="content">
      <p class="welcome">Hello There!</p>
      <h2>Login</h2>

      <form [formGroup]="loginForm" (ngSubmit)="submitLogin()">
        <mat-form-field appearance="fill" class="full-width soft-field">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" placeholder="Email" />
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width soft-field">
          <mat-label>Password</mat-label>
          <input matInput formControlName="password" type="password" placeholder="Password" />
        </mat-form-field>

        <button type="submit" mat-raised-button class="auth-btn" [disabled]="loading">
          {{ loading ? 'Signing In...' : 'Sign In' }}
        </button>
        <p *ngIf="error" class="error">{{ error }}</p>
      </form>

      <div class="divider"><span>Or</span></div>
      <div class="social-row" aria-hidden="true">
        <div class="social google">G</div>
        <div class="social facebook">f</div>
      </div>

      <p class="signup-hint">Use signup form on the right to create account.</p>
    </div>
  </div>

  <div class="panel signup-panel">
    <div class="blob blob-curve"></div>

    <div class="content">
      <h2>Sign Up</h2>

      <form [formGroup]="signUpForm" (ngSubmit)="submitSignUp()">
        <mat-form-field appearance="fill" class="full-width soft-field">
          <mat-label>Name</mat-label>
          <input matInput formControlName="name" type="text" placeholder="Name" />
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width soft-field">
          <mat-label>Email Id</mat-label>
          <input matInput formControlName="email" type="email" placeholder="Email" />
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width soft-field">
          <mat-label>Create Password</mat-label>
          <input matInput formControlName="password" type="password" placeholder="Create Password" />
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width soft-field">
          <mat-label>Timezone</mat-label>
          <input matInput formControlName="timezone" type="text" placeholder="Asia/Kolkata" />
        </mat-form-field>

        <div class="terms">
          <mat-checkbox formControlName="terms">I agree with Terms & Condition</mat-checkbox>
        </div>

        <button type="submit" mat-raised-button class="auth-btn secondary" [disabled]="signUpLoading">
          {{ signUpLoading ? 'Creating...' : 'Sign Up' }}
        </button>

        <p *ngIf="signUpError" class="error">{{ signUpError }}</p>
        <p *ngIf="signUpSuccess" class="success">{{ signUpSuccess }}</p>
      </form>

      <p class="tagline">Experience Life<br />With a touch of Nature</p>
    </div>
  </div>
</div>
