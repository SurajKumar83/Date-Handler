version: '3.9'
services:
  mongo:
    image: mongo:7
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  server:
    build: .
    restart: always
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/attendance_db
      JWT_SECRET: docker_secret
    ports:
      - '5000:5000'
    depends_on:
      - mongo
    command: sh -c "cd server && npm install && npm run dev"

  angular:
    build: .
    restart: always
    ports:
      - '4200:4200'
    depends_on:
      - server
    command: sh -c "cd angular && npm install && npx ng serve --host 0.0.0.0 --port 4200"

volumes:
  mongo_data:
